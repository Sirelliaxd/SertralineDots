$active = ~/.config/Wallpapers/saya1.png

# eDP-1 is this machine's panel. hyprlang cannot read Local/local.lua, so the pin is set here
# and the block under it already covers every other output.
wallpaper {
	monitor = eDP-1
	path = $active
	fit_mode = cover
}

wallpaper {
	monitor =
	path = $active
	fit_mode = cover
}

splash = false

ipc = true
